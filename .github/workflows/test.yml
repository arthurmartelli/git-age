name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: "0"
    steps:
      # Keep the scripts' LF line endings, which bash needs.
      - name: Disable CRLF conversion
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age zsh fish acl attr
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        # The test needs a newer bash than macOS's 3.2.
        run: brew install age bash fish
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        env:
          AGE_VERSION: v1.3.2
          AGE_SHA256: f48d8f8f9ebe903ab5027ed067652f2cc1db94bc206976430133b905dcd8e8c7
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo age.zip "https://github.com/FiloSottile/age/releases/download/$AGE_VERSION/age-$AGE_VERSION-windows-amd64.zip"
          echo "$AGE_SHA256  age.zip" | sha256sum -c -
          unzip -q age.zip
          echo "$RUNNER_TEMP\\age" >>"$GITHUB_PATH"
      - name: Go tests
        run: go test ./...
      - name: Test
        run: ./test.sh
      - name: Vet
        run: go vet ./...

  # The one check the main branch ruleset requires, whatever the matrix.
  tests:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check that every test job passed
        if: needs.test.result != 'success'
        run: exit 1
